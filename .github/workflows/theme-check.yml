name: Theme checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@4.5.2

      - name: Validate theme
        run: bash scripts/check-theme.sh
